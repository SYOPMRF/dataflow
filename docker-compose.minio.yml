services:
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dataflow

  backend:
    environment:
      FILE_STORAGE_PROVIDER: S3
      FILE_STORAGE_S3_ENABLED: "true"
      FILE_STORAGE_S3_ENDPOINT: http://silo:9000
      FILE_STORAGE_S3_REGION: us-east-1
      FILE_STORAGE_S3_BUCKET: dataflow-files
      FILE_STORAGE_S3_ACCESS_KEY: ${FILE_STORAGE_S3_ACCESS_KEY:?Define FILE_STORAGE_S3_ACCESS_KEY en .env}
      FILE_STORAGE_S3_SECRET_KEY: ${FILE_STORAGE_S3_SECRET_KEY:?Define FILE_STORAGE_S3_SECRET_KEY en .env}
      FILE_STORAGE_S3_PATH_STYLE_ACCESS: "true"

volumes:
  minio_data: