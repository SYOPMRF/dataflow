spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/dataflow
spring.datasource.username=poysmon
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

file.storage.location=uploads
file.storage.provider=${FILE_STORAGE_PROVIDER:LOCAL}
file.storage.s3.enabled=${FILE_STORAGE_S3_ENABLED:false}
file.storage.s3.endpoint=${FILE_STORAGE_S3_ENDPOINT:}
file.storage.s3.region=${FILE_STORAGE_S3_REGION:us-east-1}
file.storage.s3.bucket=${FILE_STORAGE_S3_BUCKET:dataflow-files}
file.storage.s3.access-key=${FILE_STORAGE_S3_ACCESS_KEY:}
file.storage.s3.secret-key=${FILE_STORAGE_S3_SECRET_KEY:}
file.storage.s3.path-style-access=${FILE_STORAGE_S3_PATH_STYLE_ACCESS:true}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
data-service.base-url=${DATA_SERVICE_BASE_URL:http://127.0.0.1:8000}
data-service.connect-timeout=${DATA_SERVICE_CONNECT_TIMEOUT:5000}
data-service.read-timeout=${DATA_SERVICE_READ_TIMEOUT:120000}
spring.jackson.property-naming-strategy=SNAKE_CASE
# Secure error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
